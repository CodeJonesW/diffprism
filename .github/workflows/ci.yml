name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Docs in sync with code
        run: pnpm docs:check

      - name: Journal entries well formed
        if: github.event_name != 'pull_request'
        run: pnpm journal check

      - name: Journal records this change
        if: github.event_name == 'pull_request'
        run: pnpm journal check --base origin/${{ github.base_ref }}

      - run: pnpm run build
