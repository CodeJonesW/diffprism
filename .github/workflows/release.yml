name: Publish to npm

on:
  pull_request:
    types: [closed]
    branches: [main]

# One release at a time: each reads the last published version, so two
# merges racing would both try to publish the same one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: diffprism
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Detect version bump from PR title
        id: bump
        env:
          # Passed through env, never pasted into the script: a title is text anyone can write.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"

          if echo "$PR_TITLE" | grep -qi '^major:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$PR_TITLE" | grep -qi '^minor:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$PR_TITLE" | grep -qi '^patch:'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=" >> "$GITHUB_OUTPUT"
            echo "No version prefix found, skipping publish"
          fi

      # The merge commit itself, not whatever main has moved on to since.
      - if: steps.bump.outputs.type != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - if: steps.bump.outputs.type != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - if: steps.bump.outputs.type != ''
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # main only changes through pull requests, so the release commits nothing
      # to it. The last published version lives on npm; this bumps that, here
      # in the workspace, and the tag on the merge commit records the release.
      - if: steps.bump.outputs.type != ''
        name: Choose version
        id: version
        run: |
          PUBLISHED=$(npm view diffprism version)
          npm version "$PUBLISHED" --no-git-tag-version --allow-same-version
          NEW_VERSION=$(npm version ${{ steps.bump.outputs.type }} --no-git-tag-version)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Published: $PUBLISHED. Releasing $NEW_VERSION"

      - if: steps.bump.outputs.type != ''
        run: pnpm install --frozen-lockfile

      - if: steps.bump.outputs.type != ''
        run: pnpm test

      - if: steps.bump.outputs.type != ''
        run: pnpm build

      - if: steps.bump.outputs.type != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.bump.outputs.type != ''
        name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ github.event.pull_request.body }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          NOTES_FILE=$(mktemp)
          if [ -n "$RELEASE_BODY" ]; then
            printf '%s' "$RELEASE_BODY" > "$NOTES_FILE"
          fi

          if [ -s "$NOTES_FILE" ]; then
            gh release create "$VERSION" --target "$MERGE_SHA" \
              --title "$VERSION" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$VERSION" --target "$MERGE_SHA" \
              --title "$VERSION" \
              --generate-notes
          fi

          rm -f "$NOTES_FILE"
